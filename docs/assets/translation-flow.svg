<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224" viewBox="0 0 1000 224" role="img" aria-labelledby="title description">
  <title id="title">EPUB 한국어 번역 과정</title>
  <desc id="description">원문 준비, 계획 확인과 사용량 승인, 같은 원문의 세 문체 번역, 선택적인 원문 대조 검수, 결과 확인 순으로 진행합니다. 번역과 검수 지침은 prompts.md에서 관리하며 사람이 최종 검토합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="224" rx="16" fill="#ffffff"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 88 H208"/>
    <path d="M390 88 H408"/>
    <path d="M590 88 H608"/>
    <path d="M790 88 H808"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <g transform="translate(16 16)">
