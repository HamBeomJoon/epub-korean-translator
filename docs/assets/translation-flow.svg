      <text x="16" y="27" font-size="12" font-weight="700" fill="#2563eb">03</text>
      <text x="16" y="62" font-size="20" font-weight="700" fill="#1e3a8a">세 문체 번역</text>
      <g font-size="15" fill="#334155">
        <text x="16" y="91">충실형 · 현대어</text>
        <text x="16" y="115">쉬운 한국어</text>
      </g>
    </g>
    <g transform="translate(616 16)">
      <rect width="168" height="144" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="16" y="27" font-size="12" font-weight="700" fill="#2563eb">04 · 선택</text>
      <text x="16" y="62" font-size="20" font-weight="700" fill="#1e3a8a">원문 검수</text>
      <g font-size="15" fill="#334155">
