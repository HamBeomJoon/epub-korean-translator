      <text x="16" y="27" font-size="12" font-weight="700" fill="#64748b">01</text>
      <text x="16" y="62" font-size="20" font-weight="700" fill="#0f172a">원문 준비</text>
      <g font-size="15" fill="#475569">
        <text x="16" y="91">EPUB 파일</text>
        <text x="16" y="115">장·문단 추출</text>
      </g>
    </g>
    <g transform="translate(216 16)">
      <rect width="168" height="144" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="27" font-size="12" font-weight="700" fill="#64748b">02</text>
      <text x="16" y="62" font-size="20" font-weight="700" fill="#0f172a">계획·승인</text>
      <g font-size="15" fill="#475569">
        <text x="16" y="91">실행 계획 확인</text>
        <text x="16" y="115">사용량 승인</text>
      </g>
    </g>
    <g transform="translate(416 16)">
