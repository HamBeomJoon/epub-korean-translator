name: 코드 검사

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      DEMIAN_EPUB: ''
      DEMIAN_GERMAN_EPUB: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 비밀정보와 개인 파일 검사
        run: python scripts/check_secrets.py --all
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 문법 검사
        run: python -m compileall -q epub_pipeline translate_epub.py tests scripts
      - name: 오프라인 테스트
        run: python -m unittest discover -s tests -v
